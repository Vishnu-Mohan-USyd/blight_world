[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blight-world"
version = "0.1.0"
description = "A minimal MIMo v2 room with optional binaural audition."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "MIMo==2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blight_world = ["assets/*.template"]
mimo_audition = [
    "assets/audio/*.json",
    "assets/audio/*.md",
    "assets/audio/24k/*.wav",
    "assets/audio/48k/*.wav",
    "assets/hrtf/*.md",
    "assets/hrtf/*.npz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
